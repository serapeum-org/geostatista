[project]
name = "geostatista"
version = "0.2.0"
description = "Geostatistics for the serapeum stack: variograms, kriging, and spatial autocorrelation"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
license = {text = "GNU General Public License v3"}
keywords = ["geostatistics", "kriging", "variogram", "spatial", "GIS"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is intentionally omitted from runtime deps: conda-forge / pixi users get
# gdal via the feedstock, and pyramids-gis pulls native GDAL in transitively.
# Listing pip's PyPI GDAL would force a from-source build on Windows (no wheel
# exists) and break most end-user installs.
dependencies = [
    "numpy >=2.0.0",
    "scipy >=1.10.0",
    "geopandas >=1.0.0",
    "pyramids-gis >=0.59.0",
    "loguru >=0.7.3",
]

[project.optional-dependencies]
# Variogram + surface plots via cleopatra (pyramids' viz extra). Plotting always
# goes through cleopatra, never matplotlib directly. cleopatra is declared
# explicitly because geostatista imports its glyphs directly (not just via pyramids).
# The floor is >=0.31.0 in all three places it appears (here, `dev`, `docs`) so there is
# one number to keep in step. The direct glyph imports strictly need only >=0.30.0, where
# the modules moved to `cleopatra.glyphs.*`; 0.31.0 is what pyramids' own `viz` extra
# pins (`cleopatra[tiles]>=0.31.0`), so declaring it everywhere states what actually
# gets installed rather than a lower bound the resolver can never pick.
viz = ["pyramids-gis[viz] >=0.59.0", "cleopatra >=0.31.0"]
# Tiled kriging over large grids via pyramids' lazy/out-of-core stack.
distributed = ["pyramids-gis[lazy] >=0.59.0"]
all = ["geostatista[viz,distributed]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "nbconvert >=7.0.0",
    "pre-commit >=4.6.0",
    "pre-commit-hooks >=6.0.0",
    "pytest >=9.0.3",
    "pytest-cov >= 7.1.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.5.0",
    "twine>=6.2.0",
    "pip",
    "commitizen>=4.16.2",
    "mypy>=2.1.0",
    "pytest-mock>=3.15.1",
    "pytest-mpl>=0.17.0",
    "cleopatra >=0.31.0",
    # numerical-parity oracles for the `oracle`-marked tests (never imported by src/geostatista)
    "esda >=2.5",
    "libpysal >=4.9",
    "pykrige >=1.7",
]
docs = [
    "mkdocs >=1.6.1",
    "mkdocs-material >=9.7.6",
    "mkdocstrings >=1.0.4",
    "mkdocstrings-python >=2.0.3",
    "mike >=2.2.0",
    "mkdocs-jupyter >=0.26.3",
    "mkdocs-autorefs  >=1.4.4",
    "mkdocs-macros-plugin  >=1.5.0",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.3",
    "mkdocs-panzoom-plugin",
    "notebook<8.0",
    # Required by the mkdocs-deploy action's notebook-execution preflight
    # (`import jupyter, nbconvert, ipykernel`) and to register the python3 kernel that
    # `jupyter nbconvert --execute` uses in CI, plus cleopatra so the plotting cells
    # render real outputs. The action runs the example notebooks before the mkdocs
    # build — see `notebooks-path` in .github/workflows/github-pages-mkdocs.yml.
    "jupyter",
    "nbconvert",
    "ipykernel",
    "cleopatra >=0.31.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel",
]

[project.urls]
homepage = "https://github.com/serapeum-org/geostatista"
repository = "https://github.com/serapeum-org/geostatista"
documentation = "https://serapeum-org.github.io/geostatista"
Changelog = "https://github.com/serapeum-org/geostatista/blob/main/docs/change-log.md"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geostatista", "geostatista.*"]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/geostatista"]
# Emit repo-root-relative file paths in coverage.xml (e.g. src/geostatista/...) so Codecov merges the
# coverage uploaded from the ubuntu/windows/macos matrix instead of treating the absolute paths as distinct.
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["geostatista"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
# Stay in 0.x: a breaking change (``feat!`` / ``BREAKING CHANGE``) bumps the MINOR (0.1.0 -> 0.2.0), not the
# MAJOR (-> 1.0.0). The project graduates to 1.0.0 deliberately, never as a side effect of a single commit.
major_version_zero = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "oracle: numerical-parity checks against esda/libpysal/pykrige (dev-only; skipped when the oracle library is absent)",
    "plots: plot-rendering tests via cleopatra (skipped when the viz extra / cleopatra is absent)",
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]


[tool.pixi.pypi-dependencies]
geostatista = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/geostatista -sv --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/geostatista -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "Check the example notebooks render" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "launch jupyter lab" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
docs-serve = { cmd = "mkdocs serve", description = "Serve the documentation locally" }
docs-build = { cmd = "mkdocs build", description = "Build the documentation site" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }


[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.dependencies]
# Cap Python below 3.14 for the unpinned envs (default/dev/docs/notebook):
# 3.14 is outside the supported range and many GIS deps (gdal, pyproj, ...) have
# no 3.14 wheels yet, forcing source builds. py311/py312/py313 override this.
python = ">=3.11,<3.14"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file.
pyogrio = ">=0.12.1"
